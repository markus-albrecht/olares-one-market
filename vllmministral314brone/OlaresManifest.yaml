---
olaresManifest.version: '0.10.0'
olaresManifest.type: app
apiVersion: 'v2'
metadata:
  name: vllmministral314brone
  icon: https://orales-one-market.markus-albrecht.workers.dev/icons/vllmministral314brone.png
  description: "Ministral 3 14B Reasoning AWQ via vLLM — optimised for Olares One"
  appid: vllmministral314brone
  title: Ministral 3 14B Reasoning AWQ
  version: '1.0.2'
  categories:
    - AI
entrances:
  - name: vllmministral314brone
    port: 8000
    host: vllmministral314brone
    title: Ministral 3 14B Reasoning AWQ
    icon: https://orales-one-market.markus-albrecht.workers.dev/icons/vllmministral314brone.png
    openMethod: window
    authLevel: internal
spec:
  versionName: '1.0.2'
  upgradeDescription: |
    v1.0.2: refactored to single-app deployment for better sideloading stability. Added explicit GPU request and VRAM limit workarounds.
  fullDescription: |
    Ministral 3 14B Reasoning AWQ served via vLLM, optimised for Olares One.
    RTX 5090M (24GB) + 96GB DDR5 + Core Ultra 9 275HX.
    AWQ 4-bit precision (~8.5GB VRAM model). 32K context.
    gpu-memory-utilization 0.92.
    Apache 2.0 license.
    Downloads model on first launch and caches it.
    Exposes an OpenAI-compatible API on port 8000.

  developer: markus-albrecht
  website: https://github.com/markus-albrecht/olares-one-market
  sourceCode: https://github.com/markus-albrecht/olares-one-market
  submitter: markus-albrecht
  locale:
    - en-US
  license:
    - text: Apache 2.0
      url: https://github.com/vllm-project/vllm/blob/main/LICENSE

  limitedCpu: 16
  requiredCpu: 4
  requiredDisk: 30Gi
  limitedDisk: 30Gi
  limitedMemory: 40Gi
  requiredMemory: 4Gi
  requiredGpu: 1Gi
  limitedGpu: 24Gi

  supportArch:
    - amd64
  envs:
    - envName: OLARES_USER_HUGGINGFACE_SERVICE
      required: true
      applyOnChange: true
      valueFrom:
        envName: OLARES_USER_HUGGINGFACE_SERVICE
    - envName: OLARES_USER_HUGGINGFACE_TOKEN
      required: true
      applyOnChange: true
      valueFrom:
        envName: OLARES_USER_HUGGINGFACE_TOKEN
permission:
  appData: true
options:
  apiTimeout: 0
  dependencies:
    - name: olares
      version: '>=1.12.3-0'
      type: system
